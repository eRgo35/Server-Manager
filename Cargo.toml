[workspace]
resolver = "2"
members = ["crates/sm-core", "crates/sm-services", "crates/sm-infra", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tracing = "0.1"
