name: CI

on:
  push:
    tags: ["v2.*"]
    branches: [v2, master]
  pull_request:
    branches: [master, v2]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.8.0

      - name: Install system deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: UI tests
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

  integration:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.8.0

      - name: Start sshd
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait

      - name: Wait for sshd port
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "sshd never became reachable" >&2
          exit 1

      - name: SSH integration tests
        run: cargo test -p sm-infra --test ssh_it -- --ignored --test-threads 1

      - name: Teardown
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v

  release-linux:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.8.0

      - name: Install tauri-cli + system deps
        run: |
          cargo install tauri-cli --locked
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm rpmlint

      - name: Build AppImage + rpm + PKGBUILD
        run: just build-linux

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.3.4
        with:
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            packaging/out/PKGBUILD
            packaging/out/server-manager